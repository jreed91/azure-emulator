[workspace]
resolver = "2"
members = [
    "core/emulator-core",
    "core/router",
    "services/entra",
    "services/storage",
    "services/keyvault",
    "services/managedidentity",
    "services/servicebus",
    "tools/scaffold",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
emulator-core = { path = "core/emulator-core" }
service-servicebus = { path = "services/servicebus" }
service-managedidentity = { path = "services/managedidentity" }
service-entra = { path = "services/entra" }
service-storage = { path = "services/storage" }
service-keyvault = { path = "services/keyvault" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
fancy-regex = "0.14"
fe2o3-amqp = { version = "0.18", default-features = false, features = ["acceptor"] }
fe2o3-amqp-types = "0.18"
serde_amqp = { version = "0.18", features = ["derive"] }
hmac = "0.12"
http = "1"
httpdate = "1"
jsonwebtoken = "9"
md-5 = "0.10"
percent-encoding = "2"
rand = "0.8"
rcgen = { version = "0.13", features = ["pem", "x509-parser"] }
rsa = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
uuid = { version = "1", features = ["v4"] }

# RSA key generation is unusably slow unoptimized; optimize dependencies in dev/test.
[profile.dev.package."*"]
opt-level = 2

[workspace.lints.clippy]
# Handlers return `Result<Response, Response>`: the error is itself the HTTP answer,
# built once per request, so its size is not a cost worth boxing away.
result_large_err = "allow"

# fe2o3-amqp with one addition: a sender may choose a delivery's tag (Service Bus
# lock tokens are delivery tags). See vendor/fe2o3-amqp/PATCHED.md.
[patch.crates-io]
fe2o3-amqp = { path = "vendor/fe2o3-amqp" }
