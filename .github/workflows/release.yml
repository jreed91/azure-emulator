name: Release

# Publishes the container image to GitHub Container Registry:
#   ghcr.io/<owner>/<repo>:edge and :sha-<commit>   on every push to main
#   ghcr.io/<owner>/<repo>:<version> and :latest     for a release
# and, for a release, the GitHub release's prebuilt binaries and the fidelity
# scores (tests/fidelity) measured on that commit.
#
# A release is a v* tag: either one semantic-release.yml just created, which
# calls this workflow with it, or one pushed by hand.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: The v* tag to publish
        type: string
        required: true

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # The release's tag, or empty for an edge build of main.
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  image:
    name: Image (${{ matrix.platform }})
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG || github.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          # The checkout, so a release builds its tag's commit.
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*

  manifest:
    name: Image manifest
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=edge,branch=main,enable=${{ env.TAG == '' }}
            type=sha,prefix=sha-,enable=${{ env.TAG == '' }}
            type=semver,pattern={{version}},value=${{ env.TAG }},enable=${{ env.TAG != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }},enable=${{ env.TAG != '' }}
            type=raw,value=latest,enable=${{ env.TAG != '' }}
      - working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

  binaries:
    name: Binary (${{ matrix.target }})
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked -p azure-emulator
      - run: tar -czf azure-emulator-${{ matrix.target }}.tar.gz -C target/release azure-emulator
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: azure-emulator-${{ matrix.target }}.tar.gz

  fidelity:
    name: Fidelity scores
    if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/sdk/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/sdk-js/package-lock.json
      - run: cargo build -p azure-emulator
      - run: pip install -r tests/sdk/requirements.txt
      - run: npm ci
        working-directory: tests/sdk-js
      # Failing tests lower the scores; they do not stop the release.
      - run: tests/fidelity/run.sh fidelity
      - run: |
          {
            echo "## Fidelity scores"
            echo
            echo "How many of each service's fidelity tests this release passes, measured on commit $(git rev-parse --short HEAD) with the fidelity tests in that commit (\`tests/sdk\` and \`tests/sdk-js\`). A score can drop between releases without the emulator getting worse, when new tests find gaps that were already there. \`fidelity-checks.jsonl\` lists every test and its verdict; see [Fidelity scores](https://github.com/${{ github.repository }}#fidelity-scores) in the README."
            echo
            tail -n +3 fidelity/scores.md
            echo
            echo "<details><summary>Control-plane operation coverage (<code>azure-emulator coverage</code>)</summary>"
            echo
            echo '```'
            target/debug/azure-emulator coverage
            echo '```'
            echo
            echo "</details>"
          } > fidelity/notes.md
          cp fidelity/checks.jsonl fidelity/fidelity-checks.jsonl
          cat fidelity/notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: fidelity
          path: |
            fidelity/notes.md
            fidelity/fidelity-checks.jsonl

  release:
    name: GitHub release
    needs: [binaries, fidelity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: fidelity
      # semantic-release has already created the release with its notes: put
      # the scores above them and attach the files. A tag pushed by hand has no
      # release yet, so create one with GitHub's generated notes.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            { cat notes.md; echo; gh release view "$TAG" --repo "$REPO" --json body --jq .body; } > body.md
            gh release edit "$TAG" --repo "$REPO" --notes-file body.md
            gh release upload "$TAG" --repo "$REPO" --clobber azure-emulator-*.tar.gz fidelity-checks.jsonl
          else
            gh release create "$TAG" --repo "$REPO" --generate-notes --notes-file notes.md azure-emulator-*.tar.gz fidelity-checks.jsonl
          fi
