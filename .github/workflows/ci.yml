name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: mkdir -p target/trace
      # The in-process tests reach the operations of every type served from its
      # schema (spec_examples.rs); their trace goes to the operations job.
      - run: cargo test
        env:
          AZURE_EMULATOR_TRACE: ${{ github.workspace }}/target/trace/rust.trace
      - uses: actions/upload-artifact@v4
        with:
          name: trace-rust
          path: ${{ github.workspace }}/target/trace/

  sdk:
    name: Azure SDK for Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/sdk/requirements.txt
      - run: cargo build -p azure-emulator
      - run: pip install -r tests/sdk/requirements.txt
      - run: mkdir -p target/trace
      # Every test file counts towards a service's fidelity score.
      - run: python tests/fidelity/score.py --check
      # issues/ lists exactly what the emulator and the tests report as missing.
      - run: python tools/issues/generate.py --check
      - run: python -m pytest -n auto
        working-directory: tests/sdk
        env:
          AZURE_EMULATOR_TRACE: ${{ github.workspace }}/target/trace/python.trace
      # The implemented operations, for the operations job to check the traces against.
      - run: target/debug/azure-emulator coverage --operations > target/trace/operations.txt
      - uses: actions/upload-artifact@v4
        with:
          name: trace-python
          path: ${{ github.workspace }}/target/trace/

  sdk-js:
    name: Azure SDK for JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/sdk-js/package-lock.json
      - run: cargo build -p azure-emulator
      - run: npm ci
        working-directory: tests/sdk-js
      - run: mkdir -p target/trace
      - run: npm test
        working-directory: tests/sdk-js
        env:
          AZURE_EMULATOR_TRACE: ${{ github.workspace }}/target/trace/js.trace
      - uses: actions/upload-artifact@v4
        with:
          name: trace-js
          path: ${{ github.workspace }}/target/trace/

  terraform:
    name: Terraform (azurerm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"
          terraform_wrapper: false
      - run: cargo build -p azure-emulator
      # The provider resolves per-resource hostnames itself.
      - run: tests/terraform/run.sh --hosts-line | sudo tee -a /etc/hosts
      - run: mkdir -p target/trace
      - run: tests/terraform/run.sh
        env:
          AZURE_EMULATOR_TRACE: ${{ github.workspace }}/target/trace/terraform.trace
      - uses: actions/upload-artifact@v4
        with:
          name: trace-terraform
          path: ${{ github.workspace }}/target/trace/

  cli:
    name: Azure CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p azure-emulator
      # The CLI resolves per-resource hostnames itself; the runner has `az`.
      - run: tests/cli/run.sh --hosts-line | sudo tee -a /etc/hosts
      - run: mkdir -p target/trace
      - run: tests/cli/run.sh
        env:
          AZURE_EMULATOR_TRACE: ${{ github.workspace }}/target/trace/cli.trace
      - uses: actions/upload-artifact@v4
        with:
          name: trace-cli
          path: ${{ github.workspace }}/target/trace/

  operations:
    name: Every implemented operation is tested
    needs: [test, sdk, sdk-js, terraform, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          pattern: trace-*
          merge-multiple: true
          path: traces
      - run: python tests/operations/check.py --operations traces/operations.txt traces/*.trace

  image:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          push: false
          cache-from: type=gha,scope=linux/amd64

  install:
    # The release binaries' platforms: build, package the archive as
    # release.yml does, install it with install.sh or install.ps1 from a local
    # server, and check the installed emulator starts and answers its health check.
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p azure-emulator
        env:
          AZURE_EMULATOR_VERSION: 0.0.0-ci
      - name: Package as a release
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          mkdir release
          if [ "${{ runner.os }}" = Windows ]; then
            (cd target/debug && 7z a "$GITHUB_WORKSPACE/release/azure-emulator-$target.zip" azure-emulator.exe)
          else
            tar -czf "release/azure-emulator-$target.tar.gz" -C target/debug azure-emulator
          fi
          cd release
          if command -v sha256sum > /dev/null; then sha256sum azure-emulator-* > SHA256SUMS; else shasum -a 256 azure-emulator-* > SHA256SUMS; fi
          cat SHA256SUMS
          python -m http.server 8765 > /dev/null 2>&1 &
          # It takes a moment to start listening: wait, or the install races it.
          for _ in $(seq 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8765/SHA256SUMS 2> /dev/null; then exit 0; fi
            sleep 1
          done
          echo "the local release server did not start" >&2
          exit 1
      - name: install.sh
        if: runner.os != 'Windows'
        run: |
          AZURE_EMULATOR_INSTALL_URL=http://127.0.0.1:8765 sh install.sh --dir "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:AZURE_EMULATOR_INSTALL_URL = 'http://127.0.0.1:8765'
          .\install.ps1 -Dir "$env:RUNNER_TEMP\bin"
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\bin"
      - name: The installed emulator runs
        run: |
          cd "$RUNNER_TEMP"
          test "$(azure-emulator --version)" = "azure-emulator 0.0.0-ci"
          # `health` reads the emulator's CA certificate from the same home.
          export AZURE_EMULATOR_HOME="$RUNNER_TEMP/home"
          azure-emulator --idle-timeout 120 > emulator.log 2>&1 &
          for _ in $(seq 60); do
            if azure-emulator health; then exit 0; fi
            sleep 1
          done
          cat emulator.log
          exit 1
